<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>chkd</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-root">
    <header class="header">
      <h1 class="logo">
        <svg id="logo-mark" class="logo-mark" data-state="off" viewBox="0 0 96 96" aria-hidden="true">
          <defs>
            <linearGradient id="logo-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#0c0c0c"/></linearGradient>
            <linearGradient id="logo-check" gradientUnits="userSpaceOnUse" x1="40" y1="14" x2="56" y2="80"><stop class="q-top" offset="0"/><stop class="q-bottom" offset="1"/></linearGradient>
            <clipPath id="logo-tile"><rect width="96" height="96" rx="24"/></clipPath>
          </defs>
          <g clip-path="url(#logo-tile)">
            <rect width="96" height="96" fill="url(#logo-bg)"/>
            <g fill="#fff" fill-opacity=".08"><rect x="24" width="24" height="24"/><rect x="72" width="24" height="24"/><rect y="24" width="24" height="24"/><rect x="48" y="24" width="24" height="24"/><rect x="24" y="48" width="24" height="24"/><rect x="72" y="48" width="24" height="24"/><rect y="72" width="24" height="24"/><rect x="48" y="72" width="24" height="24"/></g>
            <rect x=".75" y=".75" width="94.5" height="94.5" rx="23.25" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="1.5"/>
          </g>
          <g>
          <path d="M31 69 L20 33 L27 51 L34 27 L41 47 L48 22 L55 47 L62 27 L69 51 L76 33 L65 69 Z" fill="url(#logo-check)" stroke="url(#logo-check)" stroke-width="4" stroke-linejoin="round"/>
          <g fill="url(#logo-check)"><circle cx="20" cy="31" r="5"/><circle cx="34" cy="24" r="5"/><circle cx="48" cy="19" r="5.5"/><circle cx="62" cy="24" r="5"/><circle cx="76" cy="31" r="5"/></g>
          <rect x="24" y="69" width="48" height="10" rx="5" fill="url(#logo-check)"/>
          <path d="M32 66.5 H64" stroke="#0c0c0c" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/>
  </g>
        </svg>
        <span>chkd</span>
      </h1>
      <button id="toggle-enabled" type="button" class="power" aria-pressed="false" aria-label="Analysis">OFF</button>
    </header>

    <section class="hero" aria-live="polite">
      <p id="site-value" class="site" data-site="none">No active board</p>
      <p id="best-value" class="best">—</p>
      <p class="meta">
        <span id="status-value">Disabled</span>
        <span class="depth">Depth <span id="depth-value">—</span></span>
      </p>
      <div id="eval-bar" class="eval-bar" role="meter" aria-label="Position advantage" aria-valuemin="0" aria-valuemax="100" hidden>
        <span id="eval-white" class="eval-white"></span>
        <span id="eval-text" class="eval-text"></span>
      </div>
      <p id="error-banner" class="error" hidden></p>
    </section>

    <div class="settings">
      <section aria-labelledby="search-label">
        <div class="row">
          <span id="search-label">Time per move</span>
          <div class="seg" id="movetime-group" role="group" aria-labelledby="search-label">
            <button type="button" class="seg-btn" aria-pressed="false" data-movetime="100">0.1 s</button>
            <button type="button" class="seg-btn active" aria-pressed="true" data-movetime="300">0.3 s</button>
            <button type="button" class="seg-btn" aria-pressed="false" data-movetime="1000">1 s</button>
          </div>
        </div>
      </section>

      <label class="row arrow-row" for="auto-play">
        <span>Auto move</span>
        <input id="auto-play" class="check" type="checkbox" role="switch">
      </label>
      <label class="row arrow-row" for="show-arrow">
        <span>Move arrow</span>
        <input id="show-arrow" class="check" type="checkbox" role="switch" checked>
      </label>
      <label class="row arrow-row" for="show-eval">
        <span>Position score</span>
        <input id="show-eval" class="check" type="checkbox" role="switch" checked>
      </label>

      <div class="row">
        <span id="hash-label">Engine cache</span>
        <div class="seg" id="hash-group" role="group" aria-labelledby="hash-label">
          <button type="button" class="seg-btn" aria-pressed="false" data-hash="8">8 MB</button>
          <button type="button" class="seg-btn active" aria-pressed="true" data-hash="16">16 MB</button>
          <button type="button" class="seg-btn" aria-pressed="false" data-hash="32">32 MB</button>
        </div>
      </div>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
